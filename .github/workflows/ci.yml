name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Test
        env:
          BOURSAMIND_RAG_ENVIRONMENT: test
          BOURSAMIND_RAG_EMBEDDING_PROVIDER: deterministic
          BOURSAMIND_RAG_LLM_PROVIDER: deterministic
        run: python -m pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image
        run: >-
          docker build
          --build-arg VCS_REF="${{ github.sha }}"
          --build-arg VERSION="${{ github.sha }}"
          --build-arg SOURCE_URL="${{ github.server_url }}/${{ github.repository }}"
          --tag boursamind-rag:${{ github.sha }} .
      - name: Verify image metadata
        run: >-
          docker image inspect boursamind-rag:${{ github.sha }}
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          | grep -Fx '${{ github.sha }}'
